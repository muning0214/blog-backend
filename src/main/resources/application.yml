server:
  port: 8080

spring:
  # 默认激活 local profile：真实密码/JWT 密钥只写在 application-local.yml 里，
  # 而那个文件在 .gitignore 中，不会被提交。生产环境用环境变量覆盖即可。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/blog_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    # 没有默认值：必须由 application-local.yml 或环境变量提供
    password: ${DB_PASSWORD:}
  jackson:
    # 关键配置：Java 的 camelCase 字段会自动序列化成 snake_case JSON，
    # 与数据库列名、前端既有契约三者完全对齐，因此不需要任何 VO 转换层。
    property-naming-strategy: SNAKE_CASE
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 60MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 生产不要开 StdOutImpl，会把每条 SQL 打到控制台
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

devlog:
  jwt:
    secret: ${JWT_SECRET:}
    # 24 小时
    expiration-ms: 86400000
    header: Authorization
    prefix: "Bearer "
  upload:
    # 文件落盘的根目录，相对 blog-backend 运行目录
    dir: ./uploads
    # 对外暴露的路径前缀，WebMvcConfig 会把它映射到上面的目录
    public-prefix: /uploads
    max-image-bytes: 6291456
    max-file-bytes: 20971520
  cors:
    # 只放开开发期前端地址；生产请用 DEVLOG_CORS_ALLOWED_ORIGINS 指定真实域名
    allowed-origins: ${DEVLOG_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  site:
    allow-registration: true

logging:
  level:
    com.devlog: info
