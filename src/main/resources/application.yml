server:
  port: 8080

spring:
  # 默认激活 local profile：真实密码/JWT 密钥只写在 application-local.yml 里，
  # 而那个文件在 .gitignore 中，不会被提交。生产环境用环境变量覆盖即可。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/blog_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    # 没有默认值：必须由 application-local.yml 或环境变量提供
    password: ${DB_PASSWORD:}
  jackson:
    # 关键配置：Java 的 camelCase 字段会自动序列化成 snake_case JSON，
    # 与数据库列名、前端既有契约三者完全对齐，因此不需要任何 VO 转换层。
    property-naming-strategy: SNAKE_CASE
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 60MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 生产不要开 StdOutImpl，会把每条 SQL 打到控制台
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

devlog:
  jwt:
    secret: ${JWT_SECRET:}
    # 24 小时
    expiration-ms: 86400000
    header: Authorization
    prefix: "Bearer "
  upload:
    # 文件落盘的根目录，相对 blog-backend 运行目录
    dir: ./uploads
    # 对外暴露的路径前缀，WebMvcConfig 会把它映射到上面的目录
    public-prefix: /uploads
    max-image-bytes: 6291456
    max-file-bytes: 20971520
  cors:
    # 只放开开发期前端地址；生产请用 DEVLOG_CORS_ALLOWED_ORIGINS 指定真实域名
    allowed-origins: ${DEVLOG_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  site:
    allow-registration: true
  # 第三方登录（GitHub）。三项都填齐才视为「已启用」：
  # 缺任意一项时 /api/auth/github/enabled 返回 false，前端把登录按钮藏起来，
  # 接口本身返回 503 而不是 500 —— 这是「本部署没开这个功能」，不是服务出错。
  github:
    # client-id / client-secret 只写在 application-local.yml 或环境变量里，绝不进仓库。
    # 申请地址：GitHub → Settings → Developer settings → OAuth Apps → New OAuth App
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    # 必须与 OAuth App 里登记的 Authorization callback URL 完全一致，差一个字符都会被拒。
    # 指向前端页面而不是后端接口：令牌通过响应体返回，不落在跳转 URL 上。
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:5173/auth/github/callback}
    # 以下三项默认就是官方地址。做成可配置的唯一目的是：
    # 指向本地桩服务就能把整条 OAuth 链路（换令牌 → 读用户 → 读邮箱）端到端测完，
    # 不需要真实凭据，也不用靠人工在浏览器上点一遍。
    # authorize-uri: https://github.com/login/oauth/authorize
    # token-uri:     https://github.com/login/oauth/access_token
    # api-base:      https://api.github.com
    # read:user 拿昵称与头像；user:email 才能读到已验证邮箱（用于与既有账号关联）
    # scope: read:user user:email

logging:
  level:
    com.devlog: info
