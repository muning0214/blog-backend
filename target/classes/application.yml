server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/blog_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: muning
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT custom config
jwt:
  secret: ZmFjZWNhY2hlLWJsb2ctand0LXNlY3JldC1rZXktMjAyNC1zdXBlci1zZWNyZXQh  # facecache-blog-jwt-secret-key-2024-super-secret!
  expiration: 86400000  # 24h in ms
  header: Authorization

logging:
  level:
    com.blog: debug
